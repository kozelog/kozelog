  <style>
    :root {
      --bg:    #0d1117;
      --bg2:   #161b22;
      --bg3:   #21262d;
      --text:  #e6edf3;
      --text2: #8b949e;
      --gold:  #f0c040;
      --gold2: #e0a820;
      --border:#30363d;
      --radius:10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .site-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; }
    .header-inner { max-width: 960px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .site-logo { font-size: 16px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
    .site-logo small { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: 8px; }
    .header-nav { display: flex; gap: 20px; }
    .header-nav a { font-size: 13px; color: var(--text2); }
    .header-nav a:hover { color: var(--text); }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
    .breadcrumb { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
    .breadcrumb a { color: var(--text2); }
    .breadcrumb a:hover { color: var(--gold); }

    .page-heading { margin-bottom: 28px; }
    .page-heading h1 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .page-heading p { font-size: 13px; color: var(--text2); }

    .series-section { margin-bottom: 40px; }
    .series-heading { font-size: 14px; font-weight: 700; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .machine-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, box-shadow .2s; cursor: pointer; }
    .machine-card:hover { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 4px 16px rgba(240,192,64,.15); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-name { font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.3; }
    .card-name small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 2px; }
    .card-badge { flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-size: 11px; color: var(--text2); font-weight: 600; }
    .card-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
    .spec-item { display: flex; flex-direction: column; }
    .spec-lbl { font-size: 10px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .spec-val { font-size: 13px; font-weight: 700; color: var(--text); }
    .spec-val.gold { color: var(--gold); }
    .card-link { display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--gold); transition: background .15s; }
    .card-link:hover { background: #1c2128; }
    .card-arrow { font-size: 14px; }

    .site-footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 20px 16px; text-align: center; color: var(--text2); font-size: 12px; }
  </style>
