<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../../assets/site.js"></script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50音順で探す｜パチスロ・スマスロ機種一覧 | こぜログ</title>
  <meta name="description" content="パチスロ・スマスロ機種を50音順（あいうえお順）でまとめています。機種名の読みがなでサクッと探せます。">
  <link rel="canonical" href="https://kozelog.net/search/by-kana/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="50音順で探す｜パチスロ機種一覧 | こぜログ">
  <meta property="og:url" content="https://kozelog.net/search/by-kana/">
  <meta name="twitter:card" content="summary">
  <meta property="og:image" content="https://kozelog.net/assets/logo.png">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
    {"@type":"ListItem","position":1,"name":"トップ","item":"https://kozelog.net/"},
    {"@type":"ListItem","position":2,"name":"50音順で探す","item":"https://kozelog.net/search/by-kana/"}
  ]}</script>
  <link rel="stylesheet" href="../../assets/common.css">
  <link rel="stylesheet" href="../search.css">
</head>
<body>
<div id="site-header-ph"></div>

<div class="search-container">
  <h1 class="search-title">50音順で探す</h1>
  <p class="search-sub">パチスロ・スマスロ機種を50音順（あいうえお順）で一覧表示しています。</p>

  <nav class="search-nav">
    <a href="/search/by-date/">導入順</a>
    <a href="/search/by-maker/">メーカー名</a>
    <a href="/search/by-kana/" class="current">50音順</a>
  </nav>

  <div class="m-count" id="count"></div>
  <nav class="jump-nav" id="jump-nav"></nav>
  <div id="list"></div>
</div>

<div id="site-footer-ph"></div>
<script src="../../assets/machines/index.js"></script>
<script src="../../assets/common.js"></script>
<script>
var ASSETS_BASE='../../assets/';loadComponents(ASSETS_BASE);

(function() {
  var KANA_GROUPS = [
    { label: 'あ行', chars: 'あいうえお' },
    { label: 'か行', chars: 'かきくけこがぎぐげご' },
    { label: 'さ行', chars: 'さしすせそざじずぜぞ' },
    { label: 'た行', chars: 'たちつてとだぢづでど' },
    { label: 'な行', chars: 'なにぬねの' },
    { label: 'は行', chars: 'はひふへほばびぶべぼぱぴぷぺぽ' },
    { label: 'ま行', chars: 'まみむめも' },
    { label: 'や行', chars: 'やゆよ' },
    { label: 'ら行', chars: 'らりるれろ' },
    { label: 'わ行', chars: 'わをん' },
    { label: '英数・他', chars: '' }
  ];

  function getGroup(kana) {
    if (!kana) return '英数・他';
    var first = kana.charAt(0);
    for (var i = 0; i < KANA_GROUPS.length - 1; i++) {
      if (KANA_GROUPS[i].chars.indexOf(first) !== -1) return KANA_GROUPS[i].label;
    }
    return '英数・他';
  }

  var sorted = MACHINES_LIST.slice().sort(function(a, b) {
    return (a.kana || '').localeCompare(b.kana || '', 'ja');
  });

  document.getElementById('count').textContent = '全 ' + sorted.length + ' 機種';

  var groups = {};
  KANA_GROUPS.forEach(function(g) { groups[g.label] = []; });
  sorted.forEach(function(m) {
    var g = getGroup(m.kana);
    groups[g].push(m);
  });

  // ジャンプナビ
  var jumpHtml = KANA_GROUPS.map(function(g) {
    var count = groups[g.label].length;
    if (count === 0) return '<span class="jump-link disabled">' + g.label + '</span>';
    return '<a href="#kana-' + encodeURIComponent(g.label) + '" class="jump-link">' + g.label + '</a>';
  }).join('');
  document.getElementById('jump-nav').innerHTML = jumpHtml;

  // リスト
  var html = '';
  KANA_GROUPS.forEach(function(g) {
    var machines = groups[g.label];
    if (machines.length === 0) return;
    html += '<div class="group" id="kana-' + encodeURIComponent(g.label) + '">'
      + '<div class="group-label">' + g.label + '<span class="group-count">' + machines.length + '機種</span></div>';
    html += '<div class="m-list">';
    machines.forEach(function(m) {
      var badge = m.smart
        ? '<span class="m-badge m-badge-smart">スマスロ</span>'
        : '<span class="m-badge m-badge-medal">メダル</span>';
      var rate = m.rateS6 && m.rateS6 !== '-' ? '<span class="m-rate">設6: ' + m.rateS6 + '</span>' : '';
      var soon = m.kozelog ? '' : '<span class="m-badge m-badge-soon">準備中</span>';
      var tag = m.kozelog ? 'a' : 'div';
      var href = m.kozelog ? ' href="' + m.url + '"' : '';
      html += '<' + tag + ' class="m-row' + (m.kozelog ? '' : ' m-row-soon') + '"' + href + '>'
        + badge
        + '<span class="m-name">' + m.name + '</span>'
        + '<span class="m-maker">' + m.maker + '</span>'
        + rate + soon
        + '</' + tag + '>';
    });
    html += '</div></div>';
  });

  document.getElementById('list').innerHTML = html;
})();
</script>
</body>
</html>
