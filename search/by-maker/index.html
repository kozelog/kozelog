<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../../assets/site.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1564257400721530" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メーカー名で探す｜パチスロ・スマスロ機種一覧 | こぜログ</title>
  <meta name="description" content="パチスロ・スマスロ機種をメーカー別にまとめています。サミー、北電子、SANKYOなど、好きなメーカーからサクッと探せます。">
  <link rel="canonical" href="https://kozelog.net/search/by-maker/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="メーカー名で探す｜パチスロ機種一覧 | こぜログ">
  <meta property="og:url" content="https://kozelog.net/search/by-maker/">
  <meta name="twitter:card" content="summary">
  <meta property="og:image" content="https://kozelog.net/assets/logo.png">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
    {"@type":"ListItem","position":1,"name":"トップ","item":"https://kozelog.net/"},
    {"@type":"ListItem","position":2,"name":"メーカー名で探す","item":"https://kozelog.net/search/by-maker/"}
  ]}</script>
  <link rel="stylesheet" href="../../assets/common.css">
  <link rel="stylesheet" href="../search.css">
</head>
<body>
<div id="site-header-ph"></div>

<div class="search-container">
  <h1 class="search-title">メーカー名で探す</h1>
  <p class="search-sub">パチスロ・スマスロ機種をメーカー別に一覧表示しています。</p>

  <nav class="search-nav">
    <a href="/search/by-date/">導入順</a>
    <a href="/search/by-maker/" class="current">メーカー名</a>
    <a href="/search/by-kana/">50音順</a>
  </nav>

  <div class="m-count" id="count"></div>
  <nav class="jump-nav" id="jump-nav"></nav>
  <div id="list"></div>
</div>

<div id="site-footer-ph"></div>
<script src="../../assets/machines/index.js"></script>
<script src="../../assets/common.js"></script>
<script>
var ASSETS_BASE='../../assets/';loadComponents(ASSETS_BASE);

(function() {
  document.getElementById('count').textContent = '全 ' + MACHINES_LIST.length + ' 機種';

  var groups = {};
  MACHINES_LIST.forEach(function(m) {
    if (!groups[m.maker]) groups[m.maker] = [];
    groups[m.maker].push(m);
  });

  var makers = Object.keys(groups).sort(function(a, b) { return a.localeCompare(b, 'ja'); });

  // ジャンプナビ
  var jumpHtml = makers.map(function(mk) {
    return '<a href="#maker-' + encodeURIComponent(mk) + '" class="jump-link">' + mk + '</a>';
  }).join('');
  document.getElementById('jump-nav').innerHTML = jumpHtml;

  // リスト
  var html = '';
  makers.forEach(function(mk) {
    var machines = groups[mk].sort(function(a, b) { return b.releaseDate.localeCompare(a.releaseDate); });
    html += '<div class="group" id="maker-' + encodeURIComponent(mk) + '">'
      + '<div class="group-label">' + mk + '<span class="group-count">' + machines.length + '機種</span></div>';
    html += '<div class="m-list">';
    machines.forEach(function(m) {
      var date = m.releaseDate.substring(0,4) + '/' + parseInt(m.releaseDate.substring(5,7));
      var badge = m.smart
        ? '<span class="m-badge m-badge-smart">スマスロ</span>'
        : '<span class="m-badge m-badge-medal">メダル</span>';
      var rate = m.rateS6 && m.rateS6 !== '-' ? '<span class="m-rate">設6: ' + m.rateS6 + '</span>' : '';
      var soon = m.kozelog ? '' : '<span class="m-badge m-badge-soon">準備中</span>';
      var tag = m.kozelog ? 'a' : 'div';
      var href = m.kozelog ? ' href="' + m.url + '"' : '';
      html += '<' + tag + ' class="m-row' + (m.kozelog ? '' : ' m-row-soon') + '"' + href + '>'
        + '<span class="m-date">' + date + '</span>'
        + badge
        + '<span class="m-name">' + m.name + '</span>'
        + rate + soon
        + '</' + tag + '>';
    });
    html += '</div></div>';
  });

  document.getElementById('list').innerHTML = html;
})();
</script>
</body>
</html>
