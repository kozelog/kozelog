<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/assets/site.js"></script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メーカー名で探す | こぜログ</title>
  <meta name="description" content="パチスロ機種をメーカー別に一覧表示。北電子・アクロス・エレコ・サミーの全機種のスペック・設定差・設定判別情報を確認できます。">
  <link rel="stylesheet" href="/assets/common.css">
  <style>
    .search-wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    .page-heading { margin-bottom: 28px; }
    .page-heading h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-heading p { font-size: 13px; color: var(--text2); }
    .page-count {
      display: inline-block;
      font-size: 12px;
      color: var(--gold);
      background: rgba(0,200,224,.1);
      border: 1px solid rgba(0,200,224,.25);
      border-radius: 20px;
      padding: 2px 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* グループ見出し */
    .group-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 36px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .group-heading:first-child { margin-top: 0; }
    .group-heading-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .group-label {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }
    .group-label-en {
      font-size: 12px;
      color: var(--text2);
    }
    .group-count {
      font-size: 12px;
      color: var(--text2);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1px 10px;
    }
    .group-link {
      font-size: 12px;
      color: var(--gold);
      font-weight: 600;
    }
    .group-link:hover { opacity: .75; text-decoration: none; }

    /* 機種グリッド */
    .machine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .machine-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      color: var(--text);
    }
    .machine-card:hover {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 6px 24px rgba(0,200,224,.1);
      transform: translateY(-2px);
      text-decoration: none;
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .card-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
    }
    .card-name small {
      display: block;
      font-size: 11px;
      color: var(--text2);
      font-weight: 400;
      margin-top: 3px;
    }
    .card-badge {
      flex-shrink: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      color: var(--text2);
      font-weight: 700;
      white-space: nowrap;
    }
    .card-badge.smart {
      background: rgba(0,200,224,.1);
      border-color: rgba(0,200,224,.3);
      color: var(--gold);
    }
    .card-rates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }
    .rate-lbl {
      font-size: 10px;
      color: var(--text2);
      font-weight: 600;
      letter-spacing: .04em;
    }
    .rate-val {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 2px;
      color: var(--text);
    }
    .rate-val.hi { color: var(--gold); }
    .card-go {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      margin-top: auto;
    }

    @media (max-width: 600px) {
      .machine-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="site-header-ph"></div>

<main>
  <div class="search-wrap">

    <div class="breadcrumb">
      <a href="/">トップ</a> › メーカー名で探す
    </div>

    <div class="page-heading">
      <h1>メーカー名で探す</h1>
      <p>メーカー別に機種を表示しています</p>
      <div class="page-count" id="total-count"></div>
    </div>

    <div id="machine-list"></div>

  </div>
</main>

<div id="site-footer-ph"></div>

<script src="/assets/machines/index.js"></script>
<script src="/assets/common.js"></script>
<script>
var ASSETS_BASE = '../../assets/';
loadComponents(ASSETS_BASE);

(function() {
  // メーカー表示順
  var MAKER_ORDER = [
    { key: '北電子', en: 'KITADENSHI', slug: 'kitadenshi' },
    { key: 'アクロス', en: 'ACROSS',     slug: 'across' },
    { key: 'エレコ',   en: 'ELECO',      slug: 'eleco' },
    { key: 'サミー',   en: 'SAMMY',      slug: 'sammy' },
  ];

  // メーカーごとに仕分け
  var makerMap = {};
  MACHINES_LIST.forEach(function(m) { (makerMap[m.maker] = makerMap[m.maker] || []).push(m); });

  // 機種カードHTML生成
  function cardHTML(m) {
    return '<a href="' + m.url + '" class="machine-card">'
      + '<div class="card-top">'
      +   '<div class="card-name">' + m.name
      +     '<small>' + m.fullName + ' ｜ ' + m.releaseLabel + '</small>'
      +   '</div>'
      +   '<span class="card-badge' + (m.smart ? ' smart' : '') + '">' + m.badge + '</span>'
      + '</div>'
      + '<div class="card-rates">'
      +   '<div class="rate-item"><div class="rate-lbl">' + m.rateLabelS6 + '</div><div class="rate-val hi">' + m.rateS6 + '</div></div>'
      +   '<div class="rate-item"><div class="rate-lbl">' + m.rateLabelS1 + '</div><div class="rate-val">' + m.rateS1 + '</div></div>'
      + '</div>'
      + '<div class="card-go">解析・スペックを見る <span>→</span></div>'
      + '</a>';
  }

  // 描画
  var html = '';
  MAKER_ORDER.forEach(function(mk) {
    var items = makerMap[mk.key];
    if (!items || items.length === 0) return;
    html += '<div class="group-heading">'
      + '<div class="group-heading-left">'
      +   '<span class="group-label">' + mk.key + '</span>'
      +   '<span class="group-label-en">' + mk.en + '</span>'
      +   '<span class="group-count">' + items.length + '機種</span>'
      + '</div>'
      + '<a href="/' + mk.slug + '/" class="group-link">機種一覧 →</a>'
      + '</div>'
      + '<div class="machine-grid">';
    items.forEach(function(m) { html += cardHTML(m); });
    html += '</div>';
  });

  document.getElementById('machine-list').innerHTML = html;
  document.getElementById('total-count').textContent = '全' + MACHINES_LIST.length + '機種';
})();
</script>
</body>
</html>
