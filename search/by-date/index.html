<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../../assets/site.js"></script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>導入順で探す｜パチスロ・スマスロ機種一覧 | こぜログ</title>
  <meta name="description" content="パチスロ・スマスロ機種を導入日の新しい順にまとめています。気になる時期の機種をサクッと探せます。">
  <link rel="canonical" href="https://kozelog.net/search/by-date/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="導入順で探す｜パチスロ・スマスロ機種一覧 | こぜログ">
  <meta property="og:url" content="https://kozelog.net/search/by-date/">
  <meta name="twitter:card" content="summary">
  <meta property="og:image" content="https://kozelog.net/assets/logo.png">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
    {"@type":"ListItem","position":1,"name":"トップ","item":"https://kozelog.net/"},
    {"@type":"ListItem","position":2,"name":"導入順で探す","item":"https://kozelog.net/search/by-date/"}
  ]}</script>
  <link rel="stylesheet" href="../../assets/common.css">
  <link rel="stylesheet" href="../search.css">
</head>
<body>
<div id="site-header-ph"></div>

<div class="search-container">
  <h1 class="search-title">導入順で探す</h1>
  <p class="search-sub">パチスロ・スマスロ機種を導入日の新しい順に一覧表示しています。</p>

  <nav class="search-nav">
    <a href="/search/by-date/" class="current">導入順</a>
    <a href="/search/by-maker/">メーカー名</a>
    <a href="/search/by-kana/">50音順</a>
  </nav>

  <div class="m-count" id="count"></div>
  <div id="list"></div>
</div>

<div id="site-footer-ph"></div>
<script src="../../assets/machines/index.js"></script>
<script src="../../assets/common.js"></script>
<script>
var ASSETS_BASE='../../assets/';loadComponents(ASSETS_BASE);

(function() {
  var sorted = MACHINES_LIST.slice().sort(function(a, b) {
    return b.releaseDate.localeCompare(a.releaseDate);
  });

  document.getElementById('count').textContent = '全 ' + sorted.length + ' 機種';

  var groups = {};
  sorted.forEach(function(m) {
    var y = m.releaseDate.substring(0, 4);
    if (!groups[y]) groups[y] = {};
    var mo = parseInt(m.releaseDate.substring(5, 7));
    if (!groups[y][mo]) groups[y][mo] = [];
    groups[y][mo].push(m);
  });

  var html = '';
  Object.keys(groups).sort().reverse().forEach(function(y) {
    html += '<div class="group"><div class="group-label">' + y + '年</div>';
    var months = Object.keys(groups[y]).map(Number).sort(function(a,b){return b-a;});
    months.forEach(function(mo) {
      html += '<div class="sub-label">' + mo + '月</div><div class="m-list">';
      groups[y][mo].forEach(function(m) {
        var date = parseInt(m.releaseDate.substring(5,7)) + '/' + parseInt(m.releaseDate.substring(8,10));
        var badge = m.smart
          ? '<span class="m-badge m-badge-smart">スマスロ</span>'
          : '<span class="m-badge m-badge-medal">メダル</span>';
        var rate = m.rateS6 && m.rateS6 !== '-' ? '<span class="m-rate">設6: ' + m.rateS6 + '</span>' : '';
        var soon = m.kozelog ? '' : '<span class="m-badge m-badge-soon">準備中</span>';
        var tag = m.kozelog ? 'a' : 'div';
        var href = m.kozelog ? ' href="' + m.url + '"' : '';
        html += '<' + tag + ' class="m-row' + (m.kozelog ? '' : ' m-row-soon') + '"' + href + '>'
          + '<span class="m-date">' + date + '</span>'
          + badge
          + '<span class="m-name">' + m.name + '</span>'
          + '<span class="m-maker">' + m.maker + '</span>'
          + rate + soon
          + '</' + tag + '>';
      });
      html += '</div>';
    });
    html += '</div>';
  });

  document.getElementById('list').innerHTML = html;
})();
</script>
</body>
</html>
